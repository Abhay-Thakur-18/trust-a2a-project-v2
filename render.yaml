services:
  - type: web
    name: trust-client-agent
    runtime: docker
    dockerfilePath: client-agent/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trust-a2a-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: WORKER_HOST
        fromService:
          type: web
          name: trust-worker-agent
          property: host
      - key: WORKER_PORT
        fromService:
          type: web
          name: trust-worker-agent
          property: port
      - key: VERIFIER_HOST
        fromService:
          type: web
          name: trust-verifier-agent
          property: host
      - key: VERIFIER_PORT
        fromService:
          type: web
          name: trust-verifier-agent
          property: port
      - key: ESCROW_HOST
        fromService:
          type: web
          name: trust-escrow-service
          property: host
      - key: ESCROW_PORT
        fromService:
          type: web
          name: trust-escrow-service
          property: port
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: trust-worker-agent
    runtime: docker
    dockerfilePath: worker-agent/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trust-a2a-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: trust-verifier-agent
    runtime: docker
    dockerfilePath: verifier-agent/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trust-a2a-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: trust-escrow-service
    runtime: docker
    dockerfilePath: escrow-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trust-a2a-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: trust-a2a-db
    databaseName: trustdb
    user: trustuser
    plan: free
